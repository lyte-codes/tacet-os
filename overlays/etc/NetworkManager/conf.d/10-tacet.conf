# Tacet: no connectivity probing (spec §6). Captive portals are handled by an
# explicit "open portal page" action in Settings, never by a background check.
[connectivity]
enabled=false

[main]
# Never send the hostname to DHCP servers; never take one from them.
hostname-mode=none
# DECISION: DNS handling stays at NetworkManager's default until tacet-dns
# lands in M3, when this becomes dns=none with resolv.conf pointing at blocky.

[connection]
# Randomise the MAC per network for wifi scans and connections.
wifi.scan-rand-mac-address=yes
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=permanent
# Send no hostname / client identifier beyond what DHCP needs.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# IPv6 privacy addresses.
ipv6.ip6-privacy=2
