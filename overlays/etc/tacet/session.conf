# Tacet session configuration. Read by tacet-session at every (re)start.
# KEY=VALUE, one per line. Unknown keys are ignored; invalid values fall back
# to the default and are logged.

# Shell launched inside gamescope: kodi | mpv | custom
SHELL=kodi

# Command used when SHELL=custom (run through the shell, so quoting applies).
#SHELL_CMD=/usr/bin/foo --fullscreen

# Output resolution: auto (display's preferred mode) or WIDTHxHEIGHT.
RESOLUTION=auto

# Refresh rate in Hz: auto or an integer.
REFRESH=auto

# HDR output: on | off. Needs an HDR display and a shell that renders HDR.
HDR=off

# Extra arguments appended to the gamescope command line (advanced).
#GAMESCOPE_ARGS=
